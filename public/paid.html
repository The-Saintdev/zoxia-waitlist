<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment | Zoxia</title>
<meta name="description" content="What happened to your payment, and what to do next.">
<link rel="icon" href="/assets/mark.png" sizes="any">
<link rel="canonical" href="https://zoxia.site/paid">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>


<header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Zoxia, home">
        <img class="brand-mark" src="/assets/mark.png" width="96" height="81" alt="" decoding="async">
        <span class="brand-name">Zoxia</span>
      </a>
    </div>
  </header>

<main id="main" class="page">
  <div class="wrap">
    <article class="prose">

    <h1 id="title">Checking your payment</h1>
    <p class="lede" id="body">One moment.</p>

    <p class="note" id="next" hidden>
      Open Zoxia on your phone and your plan will be there. Nothing to enter.
    </p>

    <!-- Both hidden until there is a reference, because "quote the reference
         below" above the words "no reference" helps nobody. -->
    <p class="note" id="ask" hidden>
      If anything looks wrong, write to
      <a href="mailto:support@zoxia.site">support@zoxia.site</a> and quote the reference below.
    </p>

    <p class="note" id="ref-line" hidden><code id="ref"></code></p>

    </article>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <span>Zoxia, by Cresco Ai LTD</span>
    <span class="foot-links">
      <a href="/legal/privacy">Privacy</a>
      <a href="/legal/terms">Terms</a>
      <a href="/support">Support</a>
    </span>
  </div>
</footer>

<script>
/*
 * Where Paystack sends someone back to.
 *
 * This page reports; it does not grant. The webhook is what activates a plan,
 * and it does so whether or not this page is ever opened — somebody closing
 * the tab on the bank's screen must still get what they paid for. So the worst
 * case here is a page that cannot confirm, which is why it never says the
 * payment failed. It says we could not confirm it yet, which is the true
 * statement and the one that does not send a paying customer to support.
 */
(function () {
  'use strict';

  var params = new URLSearchParams(window.location.search);
  // Paystack sends reference and trxref; Flutterwave sends tx_ref. Read all
  // three rather than assuming which provider answered.
  var ref = params.get('reference') || params.get('trxref') || params.get('tx_ref') || '';

  var title = document.getElementById('title');
  var body = document.getElementById('body');
  var next = document.getElementById('next');
  var refEl = document.getElementById('ref');

  if (ref) {
    refEl.textContent = ref;
    document.getElementById('ask').hidden = false;
    document.getElementById('ref-line').hidden = false;
  }

  if (!ref) {
    title.textContent = 'Nothing was charged';
    body.textContent =
      'You came back without completing the payment. You can pick a plan again whenever you are ready.';
    return;
  }

  /*
   * The session the pricing page left for us, used once and removed.
   *
   * Absent whenever storage was refused, or the payment was finished in a
   * different tab or on a different device from the one that started it, which
   * happens often enough with bank redirects to be normal rather than an
   * error. The fallback below covers it honestly.
   */
  var token = null;
  try {
    token = sessionStorage.getItem('zoxia.checkout');
    sessionStorage.removeItem('zoxia.checkout');
  } catch (e) {
    token = null;
  }

  if (!token) {
    title.textContent = 'Payment sent';
    body.textContent =
      'We cannot confirm it from this page, because you finished paying somewhere this browser ' +
      'cannot see. Your bank confirms payments to us separately and your plan is activated ' +
      'either way.';
    next.hidden = false;
    return;
  }

  fetch('https://api.zoxia.site/api/billing/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ reference: ref })
  })
    .then(function (r) {
      // Parsed defensively for the same reason the pricing page does it: an
      // upstream error page is not JSON, and its parse error must not become
      // the sentence somebody reads after paying.
      return r.text().then(function (raw) {
        try {
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      });
    })
    .then(function (result) {
      if (result && result.success) {
        title.textContent = 'Payment received';
        body.textContent = result.credited
          ? result.credited + ' extra X posts have been added to your account.'
          : 'Your plan is active.';
        next.hidden = false;
        return;
      }
      throw new Error('unconfirmed');
    })
    .catch(function () {
      title.textContent = 'We could not confirm it here';
      body.textContent =
        'That does not mean it failed. Your bank confirms payments to us separately, and your ' +
        'plan is activated either way. Open the app in a few minutes and it should be there.';
      next.hidden = false;
    });
})();
</script>

</body>
</html>
